<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nestory</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nestory">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F9FBFF">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Sky blue: one calm blue carries every tab, button and banner on bright white; the app always stays light.
   Sticker icons keep a few friendly accents (coral hearts, amber stars, green leaves, cyan water).
   Quicksand for headings and numbers, Nunito for reading. */
:root{
  --bg:#F9FBFF; --card:#FFFFFF; --ink:#1C2638; --muted:#5B677D; --line:#E6ECF5; --eye:#1C2638;
  --lilac:#2F7FE0; --lilac-soft:#E3EEFD; --lilac-ink:#1A5FB4;
  --sky:#33B5E5;   --sky-soft:#DFF4FC;   --sky-ink:#0C6E94;
  --berry:#F4627A; --berry-soft:#FFE5EA; --berry-ink:#B8344E;
  --sun:#FFB547;   --sun-soft:#FFF3DB;   --sun-ink:#8A5600;
  --mint:#3BB27A;  --mint-soft:#E0F5EA;  --mint-ink:#1B7A4C;
  --on-strong:#FFFFFF; --paper:#FFFFFF; --stk:#1F2B42;
  --shadow:0 1px 2px rgba(28,38,56,.05),0 8px 24px rgba(28,38,56,.07);
  --display:"Quicksand","Nunito","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111826; --card:#1B2435; --ink:#EEF3FA; --muted:#A3AFC2; --line:#2C3850; --eye:#111826;
    --lilac:#6FA8F0; --lilac-soft:#1E3355; --lilac-ink:#A8CBF7;
    --sky:#5CC8EE;   --sky-soft:#173A4A;   --sky-ink:#A3E0F5;
    --berry:#FF8599; --berry-soft:#45222B; --berry-ink:#FFB3C0;
    --sun:#FFC56E;   --sun-soft:#3F331C;   --sun-ink:#FFDDA3;
    --mint:#5CCB96;  --mint-soft:#183C2C;  --mint-ink:#A1E5C3;
    --on-strong:#111826; --paper:#EEF3FA; --stk:#0B101A;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111826; --card:#1B2435; --ink:#EEF3FA; --muted:#A3AFC2; --line:#2C3850; --eye:#111826;
  --lilac:#6FA8F0; --lilac-soft:#1E3355; --lilac-ink:#A8CBF7;
  --sky:#5CC8EE;   --sky-soft:#173A4A;   --sky-ink:#A3E0F5;
  --berry:#FF8599; --berry-soft:#45222B; --berry-ink:#FFB3C0;
  --sun:#FFC56E;   --sun-soft:#3F331C;   --sun-ink:#FFDDA3;
  --mint:#5CCB96;  --mint-soft:#183C2C;  --mint-ink:#A1E5C3;
  --on-strong:#111826; --paper:#EEF3FA; --stk:#0B101A;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.28);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
img{max-width:100%}

#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative}
#top{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
#top .logo{width:40px;height:40px;flex:none}
#top h1{font-size:1.55rem;flex:1}
#top .back{font-weight:600;color:var(--berry);padding:8px 10px 8px 0;font-size:1rem}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:1.3rem;display:grid;place-items:center}
#main{flex:1;overflow-y:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
#tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px 8px}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.72rem;font-weight:600;color:var(--muted);padding:6px 0;border-radius:14px}
#tabs button span{font-size:1.35rem;line-height:1.2;filter:grayscale(.7);opacity:.75}
#tabs button[aria-current="page"]{color:var(--berry);background:var(--berry-soft)}
#tabs button[aria-current="page"] span{filter:none;opacity:1}

.banner{background:var(--sun-soft);border-radius:14px;padding:10px 14px;font-size:.88rem;margin-bottom:12px}
.hello{font-size:1.7rem;margin:6px 0 2px}
.sub{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:1.15rem;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 button{font:600 .85rem var(--body);color:var(--berry)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px}
.head h2{font-size:1.6rem}
.head p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.btn{background:var(--berry);color:#fff;font-weight:700;border-radius:999px;padding:10px 18px;white-space:nowrap;text-align:center}
:root[data-theme="dark"] .btn{color:#2A0F1B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#2A0F1B}}
.btn.soft{background:var(--berry-soft);color:var(--berry)}
.btn.mint{background:var(--mint-soft);color:var(--mint)}
.btn.wide{width:100%;padding:13px}
.btn[disabled]{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips .btn{padding:8px 14px;font-size:.9rem}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:22px;padding:14px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;background:var(--card);box-shadow:var(--shadow)}
.tile .em{font-size:1.7rem;width:46px;height:46px;border-radius:16px;display:grid;place-items:center}
.tile b{font-family:var(--display);font-size:1.08rem;display:block;line-height:1.2;margin-top:8px}
.tile small{color:var(--muted);font-size:.8rem}
.t0 .em{background:var(--berry-soft)}.t1 .em{background:var(--mint-soft)}.t2 .em{background:var(--sky-soft)}.t3 .em{background:var(--sun-soft)}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;width:100%;box-shadow:var(--shadow)}
.row .ic{font-size:1.3rem;width:40px;height:40px;border-radius:14px;background:var(--bg);display:grid;place-items:center;flex:none}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-weight:600;overflow-wrap:anywhere}
.row .rt small{color:var(--muted);display:block;font-size:.84rem;overflow-wrap:anywhere}
.row .rr{font-weight:700;white-space:nowrap;font-size:.95rem;text-align:right}
.row.done .rt b{text-decoration:line-through;color:var(--muted)}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:.9rem;color:#fff}
.tick.on{background:var(--mint);border-color:var(--mint)}
.day{font-weight:700;color:var(--muted);font-size:.82rem;margin:14px 4px 6px}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty .em{font-size:2.6rem;display:block;margin-bottom:6px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;background:var(--sky-soft);color:var(--sky)}
.pill.soon{background:var(--sun-soft);color:#9A6A00}.pill.now{background:var(--berry-soft);color:var(--berry)}
:root[data-theme="dark"] .pill.soon{color:var(--sun)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.soon{color:var(--sun)}}

.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.month button{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:1.2rem;text-align:center}
.month b{font-family:var(--display);font-size:1.2rem}
.big{font-family:var(--display);font-size:2rem;line-height:1.1}
.bar{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--mint)}
.bar i.over{background:var(--berry)}
.catrow{margin-bottom:12px}
.catrow .l{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;align-items:center}
.catrow input{width:110px;text-align:right}
.drops{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.drops span{font-size:1.5rem;filter:grayscale(1);opacity:.3}
.drops span.on{filter:none;opacity:1}

.polas{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;padding-top:6px}
.pola{background:#fff;padding:8px 8px 10px;border-radius:6px;box-shadow:0 8px 20px rgba(60,40,80,.18);color:#33263F;display:block;width:100%}
.pola:nth-child(odd){transform:rotate(-2deg)}.pola:nth-child(even){transform:rotate(1.6deg)}.pola:nth-child(3n){transform:rotate(-.6deg)}
.pola img,.pola .ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:3px;background:#EEE6F5}
.pola .ph{display:grid;place-items:center;font-size:2rem}
.pola b{font-family:var(--display);display:block;margin-top:6px;line-height:1.15}
.pola small{color:#77698A;font-size:.78rem}

.chat{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.msg{max-width:80%;padding:9px 13px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--berry-soft)}
.msg small{display:block;color:var(--muted);font-size:.7rem;margin-top:2px}
.composer{position:sticky;bottom:-24px;background:var(--bg);padding:8px 0 14px;display:flex;gap:8px;margin-top:auto}
.composer input{flex:1}
.quick{display:flex;gap:6px;position:sticky;bottom:44px}
.quick button{font-size:1.3rem;background:var(--card);border-radius:50%;width:38px;height:38px;text-align:center;box-shadow:var(--shadow)}
.chatwrap{display:flex;flex-direction:column;min-height:100%}

input:not([type=checkbox]):not([type=file]),select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;min-height:46px}
.card input:not([type=checkbox]),.card select{background:var(--bg)}
textarea{min-height:90px;resize:vertical}
label.f{display:block;margin-bottom:12px;font-weight:600;font-size:.88rem}
label.f>span{display:block;margin-bottom:4px}
label.chk{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:600}
label.chk input{width:22px;height:22px;accent-color:var(--berry)}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.emojis button{font-size:1.5rem;width:44px;height:44px;border-radius:50%;background:var(--bg);text-align:center}
.emojis button[aria-pressed="true"]{background:var(--berry-soft);outline:2px solid var(--berry)}

#veil{position:fixed;inset:0;background:rgba(30,18,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#veil.open{display:flex}
#sheet{background:var(--card);width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
#sheet .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
#sheet .sh h2{font-size:1.35rem}
#sheet .x{width:38px;height:38px;border-radius:50%;background:var(--bg);text-align:center;font-size:1.1rem;flex:none}
.actions{display:flex;gap:10px;margin-top:6px}
.actions .btn{flex:1}
.note{font-size:.84rem;color:var(--muted);margin:0 0 12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:16px;z-index:40;max-width:min(92%,480px);display:none;gap:12px;align-items:center;font-size:.92rem}
#toast.open{display:flex}
#toast button{color:var(--sun);font-weight:700;white-space:nowrap}
#ring{position:fixed;inset:0;background:var(--berry);color:#fff;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#ring.open{display:flex}
#ring .t{font-family:var(--display);font-size:4rem;line-height:1}
#ring button{background:#fff;color:#B83360;font-weight:700;border-radius:999px;padding:14px 30px;min-width:200px;text-align:center}
#ring button.ghost{background:rgba(255,255,255,.2);color:#fff}
#ring .bell{font-size:4rem;animation:wig .5s infinite alternate}
@keyframes wig{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
#splash{position:absolute;inset:0;background:var(--bg);display:grid;place-items:center;z-index:10;text-align:center}
#splash svg{width:96px;height:96px}
#splash p{color:var(--muted);margin:8px 0 0}
.answer{white-space:pre-wrap;line-height:1.55}
.rev{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rev input[type=checkbox]{width:22px;height:22px;accent-color:var(--berry)}
.rev select{grid-column:2/4;min-height:38px;padding:6px 10px}
.rev small{color:var(--muted)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two small{color:var(--muted);font-size:.82rem}
.two .big{font-size:1.5rem}
.ec h3{font-size:1.25rem;margin-bottom:4px}
.ec dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:8px 0 4px;font-size:1.02rem}
.ec dt{color:var(--muted)}
.ec dd{margin:0;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.mp{display:grid;grid-template-columns:76px 1fr;gap:6px 10px;align-items:center}
.mp input{min-height:40px!important;padding:7px 10px!important}
.cd{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.cd>div{background:var(--bg);border-radius:16px;padding:10px 8px;text-align:center}
.cd b{font-family:var(--display);font-size:1.9rem;display:block;line-height:1.05}
.cd small{color:var(--muted);font-size:.78rem;display:block}
.otd{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.otd button{flex:none;width:100px;text-align:center}
.otd img,.otd .ph{width:100px;height:100px;object-fit:cover;border-radius:14px;display:grid;place-items:center;background:var(--bg);font-size:2rem}
.tick .ti{opacity:.55;font-size:.95rem}
#lock{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#lock.open{display:flex}
#lock input{max-width:220px;text-align:center;font-size:1.4rem;letter-spacing:.3em}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cwk{font-size:.72rem;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.cday{background:var(--card);border-radius:12px;min-height:52px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;box-shadow:var(--shadow)}
.cday b{font-size:.92rem;font-weight:600}
.cday .cev{font-size:.72rem;line-height:1.1;letter-spacing:-1px;min-height:.9rem}
.cday.today b{color:var(--berry)}
.cday.sel{outline:2px solid var(--berry);background:var(--berry-soft)}
.post .phead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.post .phead small{display:block;color:var(--muted);font-size:.78rem}
.ptext{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 10px;font-size:1.02rem}
.pgrid{display:grid;gap:4px;grid-template-columns:1fr 1fr;margin:6px 0 8px}
.pgrid.n1{grid-template-columns:1fr}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.pgrid.n1 img{aspect-ratio:auto;max-height:420px}
.pgrid .rm{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;text-align:center}
.pbar{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.pact{padding:6px 12px;border-radius:999px;background:var(--bg);font-weight:600;font-size:.9rem}
.pact.on{background:var(--berry-soft);color:var(--berry)}
.pcom{margin-top:8px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.pcom>div{background:var(--bg);border-radius:12px;padding:7px 10px;overflow-wrap:anywhere}
.pcom small{color:var(--muted)}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg);border-radius:14px;padding:10px 12px;margin-bottom:6px}
.frow .rt{flex:1;min-width:120px}
.frow .rt b{display:block;overflow-wrap:anywhere;font-weight:600}
.frow .rt small{color:var(--muted)}
.frow a,.frow .mini{padding:6px 12px;font-size:.85rem;border-radius:999px;background:var(--berry-soft);color:var(--berry);font-weight:700;text-decoration:none}
.tgl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-weight:600;font-size:.92rem}
.tgl input[type=checkbox]{width:22px;height:22px;accent-color:var(--berry)}
.tgl input[type=time]{width:130px;min-height:40px}
@media (prefers-reduced-motion:reduce){#ring .bell{animation:none}}

/* ===== Soft & cute theme ===== */
:root,#app,#pop,#veil,#lock,#toast{--sec:var(--lilac);--sec-soft:var(--lilac-soft);--sec-ink:var(--lilac-ink);--sec-strong:var(--lilac-ink)}
body{font-size:14px;line-height:1.5}
h1,h2,h3,.big,.hello{font-family:var(--display);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.big{font-size:1.55rem;font-variant-numeric:tabular-nums}
.i{display:inline-grid;place-items:center;width:1.25em;height:1.25em;flex:none;line-height:0}
.i svg{width:100%;height:100%;fill:none;stroke-linecap:round;stroke-linejoin:round}
.i.st svg{stroke:var(--stk);stroke-width:1.5}
.i.ui svg{stroke:currentColor;stroke-width:2}
.i.off{filter:grayscale(1);opacity:.45}
#top{padding:12px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
#top h1{font-size:1.3rem;color:var(--ink)}
#top .back{display:inline-flex;align-items:center;gap:4px;color:var(--sec-ink);font-weight:700;font-size:.95rem;padding:8px 10px 8px 0}
#top .back .i{font-size:1.2rem}
.avatar{box-shadow:none;background:var(--sec-soft);font-size:1.25rem}
#main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#tabs{gap:4px;padding:6px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--card)}
#tabs button{gap:2px;font-size:.7rem;font-weight:700;letter-spacing:.01em;padding:7px 0 5px;border-radius:16px;transition:background .2s,color .2s}
#tabs button .i{font-size:1.5rem;transition:filter .2s,opacity .2s,transform .2s}
#tabs button:not([aria-current]) .i{filter:grayscale(1);opacity:.5}
#tabs button[aria-current="page"] .i{transform:translateY(-1px) scale(1.06)}
#tabs button[aria-current="page"]{color:var(--sec-ink);background:var(--sec-soft)}
#tabs button[aria-current="page"] .i svg{stroke-width:2.1}
.card{border-radius:22px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h2{font-size:.98rem;align-items:center}
.card h2 .ttl{display:inline-flex;align-items:center;gap:8px}
.card h2 .ttl .i{color:var(--sec-ink);font-size:1.15rem}

.popcard p{margin:0 0 10px;color:var(--muted);font-size:.88rem}

.popcard .today div{display:flex;align-items:center;gap:8px;font-size:.86rem;font-weight:600}

.popcard .pa{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.favs{padding:6px 14px}

/* ---------- home server mode (server.js on your own laptop) ---------- */
async function lanConnect(){
  let hello;
  try{const r=await fetch('api/hello',{cache:'no-store'});if(!r.ok)return null;hello=await r.json();if(hello.app!=='nestory')return null}catch{return null}
  const snapOf=async t=>{try{const r=await fetch('api/snapshot',{headers:{'x-token':t},cache:'no-store'});return r.ok?await r.json():null}catch{return null}};
  let tok=null;try{tok=localStorage.getItem('nestory.token')}catch{}
  let snap=tok?await snapOf(tok):null;
  while(!snap){tok=await lanLogin(hello);try{localStorage.setItem('nestory.token',tok)}catch{}snap=await snapOf(tok)}
  const cols={items:new Map(snap.items),chat:new Map(snap.chat),priv:new Map(snap.priv)},subs={items:[],chat:[],priv:[]};
  const scope=p=>p.startsWith('data/users/')?'priv':p;
  const emit=s=>{const docs=[...cols[s]].map(([id,d])=>({id,exists:true,data:()=>d}));subs[s].forEach(f=>f({docs}))};
  const api=async(m,s,id,body)=>{let r;try{r=await fetch('api/doc/'+s+'/'+encodeURIComponent(id),{method:m,headers:{'x-token':tok,'content-type':'application/json'},body:body?JSON.stringify(body):undefined})}catch{throw new Error('The laptop running Nestory is not reachable.')}
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Server error '+r.status);return j};
  const col=p=>{const s=scope(p);const c={orderBy:()=>c,limit:()=>c,
    onSnapshot(fn){subs[s].push(fn);setTimeout(()=>emit(s),0);return()=>{}},
    doc:id=>({async set(d){if(cols[s]){cols[s].set(id,d);emit(s)}await api('PUT',s,id,d)},async delete(){if(cols[s]){cols[s].delete(id);emit(s)}await api('DELETE',s,id)},async get(){const r=await api('GET',s,id);return{id,exists:!!r.data,data:()=>r.data}}})};return c};
  let opened=false;
  const es=new EventSource('api/events?token='+encodeURIComponent(tok));
  es.onmessage=e=>{try{const m=JSON.parse(e.data);if(!cols[m.s])return;if(m.d==null)cols[m.s].delete(m.id);else cols[m.s].set(m.id,m.d);emit(m.s)}catch{}};
  es.onopen=async()=>{if(opened){const n=await snapOf(tok);if(n){for(const k in cols){cols[k]=new Map(n[k]);emit(k)}}}opened=true};
  return{db:{collection:col},uid:snap.uid};
}

/* ---------- online mode (Supabase) ---------- */
async function supaConnect(cfg){
  await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
  const sb=window.supabase.createClient(cfg.url.trim(),cfg.key.trim());
  let session=(await sb.auth.getSession()).data.session;
  while(!session)session=await supaLogin(sb);
  const uid=session.user.id;
  S.signOut=async()=>{await sb.auth.signOut();location.reload()};
  let nest=await supaNest(sb,uid);            // undefined = database not updated for nests yet; null = no nest yet
  while(nest===null)nest=await nestSetup(sb,uid);
  S.nest=nest||null;
  const nid=nest?nest.id:null,inNest=t=>nid?t.eq('nest_id',nid):t;
  const load=async()=>{const out={items:new Map(),chat:new Map(),priv:new Map()};
    for(let from=0;;from+=1000){const{data,error}=await inNest(sb.from('docs').select('scope,id,data').in('scope',['items','chat','priv'])).order('id').range(from,from+999);
      if(error)throw new Error(error.message);for(const r of data)out[r.scope]&&out[r.scope].set(r.id,r.data);if(data.length<1000)break}
    return out};
  let cols=await load();const subs={items:[],chat:[],priv:[]};
  const scope=p=>p.startsWith('data/users/')?'priv':p;
  const emit=s=>{const docs=[...cols[s]].map(([id,d])=>({id,exists:true,data:()=>d}));subs[s].forEach(f=>f({docs}))};
  const chk=r=>{if(r.error)throw new Error(r.error.message);return r};
  const col=p=>{const s=scope(p);const c={orderBy:()=>c,limit:()=>c,
    onSnapshot(fn){subs[s].push(fn);setTimeout(()=>emit(s),0);return()=>{}},
    doc:id=>({
      async set(d){if(cols[s]){cols[s].set(id,d);emit(s)}chk(await sb.from('docs').upsert({...(nid?{nest_id:nid}:{}),scope:s,id,owner:s==='priv'?uid:null,data:d,updated_at:new Date().toISOString()},nid?{onConflict:'nest_id,scope,id'}:undefined))},
      async delete(){if(cols[s]){cols[s].delete(id);emit(s)}chk(await inNest(sb.from('docs').delete()).eq('scope',s).eq('id',id))},
      async get(){const r=chk(await inNest(sb.from('docs').select('data')).eq('scope',s).eq('id',id).maybeSingle());return{id,exists:!!r.data,data:()=>r.data&&r.data.data}}})};return c};
  let live=false;
  sb.channel('nestory-docs').on('postgres_changes',{event:'*',schema:'public',table:'docs',...(nid?{filter:'nest_id=eq.'+nid}:{})},p=>{
    const del=p.eventType==='DELETE',r=del?p.old:p.new;if(!r||!cols[r.scope])return;
    if(nid&&r.nest_id&&r.nest_id!==nid)return;
    if(del)cols[r.scope].delete(r.id);else cols[r.scope].set(r.id,r.data);emit(r.scope);
  }).subscribe(async st=>{if(st==='SUBSCRIBED'){if(live){try{cols=await load();for(const k in subs)emit(k)}catch{}}live=true}});
  document.addEventListener('visibilitychange',async()=>{if(!document.hidden){try{cols=await load();for(const k in subs)emit(k)}catch{}}});
  const bucket=()=>sb.storage.from('nestory-files'),pre=(nid||'shared')+'/';
  S.files={
    async upload(path,blob,type){const r=await bucket().upload(pre+path,blob,{contentType:type,upsert:true});if(r.error)throw new Error(/bucket not found/i.test(r.error.message)?'File storage is not set up yet. Run the notifications and files setup script.':r.error.message)},
    async url(path,download){const r=await bucket().createSignedUrl(pre+path,3600,download?{download}:undefined);if(r.error)throw new Error(r.error.message);return r.data.signedUrl},
    async remove(paths){if(paths.length)await bucket().remove(paths.map(x=>pre+x))}
  };
  if(cfg.push&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window){
    S.push={key:cfg.push,
      async save(sub,prefs){const r=await sb.from('push_subs').upsert({endpoint:sub.endpoint,user_id:uid,sub,tz:(Intl.DateTimeFormat().resolvedOptions().timeZone)||'Asia/Dubai',prefs,updated_at:new Date().toISOString()});if(r.error)throw new Error(/push_subs/.test(r.error.message)?'Notifications are not set up in Supabase yet. Run the notifications and files setup script.':r.error.message)},
      async prefs(endpoint){const r=await sb.from('push_subs').select('prefs').eq('endpoint',endpoint).maybeSingle();return r.data?r.data.prefs:null},
      async remove(endpoint){await sb.from('push_subs').delete().eq('endpoint',endpoint)},
      async send(body){const r=await sb.functions.invoke('nestory-push',{body});if(r.error)throw new Error(r.error.message||'The notification service did not answer.');return r.data}};
    S.notify=b=>S.push.send(b).catch(()=>{});
    navigator.serviceWorker.register('sw.js').then(async reg=>{try{const sub=await reg.pushManager.getSubscription();S.pushOn=!!sub&&Notification.permission==='granted'}catch{}}).catch(()=>{});
    navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.go)routeTo(e.data.go)});
  }
  return{db:{collection:col},uid};
}

const dim=(y,m)=>new Date(y,m+1,0).getDate();

  if(r==='Weekly')return d.getDay()===s.getDay();
  if(r==='Monthly')return d.getDate()===Math.min(s.getDate(),dim(d.getFullYear(),d.getMonth()));
  if(r==='Yearly')return d.getMonth()===s.getMonth()&&d.getDate()===Math.min(s.getDate(),dim(d.getFullYear(),d.getMonth()));

function calCollect(y,m){
  const days={},last=dim(y,m),put=(d,e)=>{if(d>=1&&d<=last)(days[d]=days[d]||[]).push(e)};
  const exact=(v,e)=>{const d=pd(v);if(d&&d.getFullYear()===y&&d.getMonth()===m)put(d.getDate(),e)};
  const yearly=(v,e)=>{const d=pd(v);if(d&&d.getMonth()===m&&d.getFullYear()<=y)put(Math.min(d.getDate(),last),e)};
  for(const i of S.items.values()){const E=(icon,title,x)=>({icon,title,item:i,...(x||{})});
    switch(i.kind){
      case'plan':for(let d=1;d<=last;d++)if(occursOn(i,new Date(y,m,d)))put(d,E('🗓️',i.title,{time:i.time}));break;
      case'member':if(i.dob)yearly(i.dob,E('🎂',i.name+"'s birthday"));break;
      case'date':(i.yearly?yearly:exact)(i.date,E(i.type==='Birthday'?'🎂':i.type==='Anniversary'?'💍':'📅',i.title));break;
      case'insurance':exact(i.renewal,E('🛡️',i.name+' renewal'));break;
      case'house':exact(i.renewal,E('🏠',i.name+' contract renewal'));exact(i.rentDue,E('🔑','Rent due: '+i.name));break;
      case'document':exact(i.expiry,E('🪪',i.name+' expires'));break;
      case'vehicle':exact(i.regExpiry,E('🚗',i.name+' registration'));exact(i.insExpiry,E('🚗',i.name+' insurance'));exact(i.service,E('🔧',i.name+' service'));break;
      case'medical':exact(i.followUp,E('🩺','Follow-up: '+i.title));break;
      case'subscription':exact(i.nextDue,E('🔁',i.name+' due'));break;
      case'bucket':if(!i.done)exact(i.target,E('🌈',i.name));break;
      case'trip':exact(i.from,E('✈️','Trip: '+i.name));if(i.to)exact(i.to,E('🏡','Back from '+i.name));break;
      case'saving':exact(i.maturity,E('🐷',i.name+' matures'));break;
      case'loan':{const dd=Math.round(num(i.dueDay));if(dd>=1&&dd<=31)put(Math.min(dd,last),E('💳',i.name+' payment'));exact(i.endDate,E('🎉',i.name+' last payment'));break}
      case'warranty':exact(i.warrantyEnd,E('🧾',i.item+' warranty ends'));break;
      case'maintenance':exact(i.nextDue,E('🛠️',i.task));break;
      case'chore':if(!i.done)exact(i.due,E('🧹',i.task));break;
      case'workout':exact(i.date,E('🏃',(i.who?i.who+': ':'')+(i.type||'Workout')+(num(i.distance)?' '+num(i.distance)+' km':'')));break;
    }}
  const cy=cycle();if(cy&&cy.next.getFullYear()===y&&cy.next.getMonth()===m)put(cy.next.getDate(),{icon:'🌷',title:'Period expected (estimate)'});

function cycle(){
  const st=all('period').map(p=>pd(p.start)).filter(Boolean).sort((a,b)=>a-b);if(!st.length)return null;
  const gaps=[];for(let i=1;i<st.length;i++){const g=Math.round((st[i]-st[i-1])/864e5);if(g>=15&&g<=60)gaps.push(g)}
  const last6=gaps.slice(-6),avg=last6.length?Math.round(last6.reduce((a,b)=>a+b,0)/last6.length):28,last=st[st.length-1];
  let next=new Date(last.getFullYear(),last.getMonth(),last.getDate()+avg);
  return{avg,next,last,guess:!last6.length,day:Math.round((t0()-last)/864e5)+1};
}

    .replace(/x{2,}\d*|\*{2,}\d*|\b\d{6,}\b|\b(AED|USD|EUR|GBP|INR|SAR)\b|\b\d+\.\d{2}\b/gi,' ').replace(/\s{2,}/g,' ').replace(/^[\s\-:|,]+|[\s\-:|,]+$/g,'').slice(0,80);
}
function parseStatementText(text,ref){
  const out=[];
  for(const raw of String(text||'').split(/\r?\n/)){
    const line=raw.replace(/\s+/g,' ').trim();if(line.length<8)continue;
    const d=findDate(line,ref);if(!d||d.index>20)continue;
    const a=lastAmount(line.slice(d.end));if(!a)continue;
    let mid=line.slice(d.end,d.end+a.index);const d2=findDate(mid,ref);if(d2&&d2.index<4)mid=mid.slice(d2.end);
    const title=cleanTitle(mid);if(!title||!/[a-z]/i.test(title)||STMT_SKIP.test(line))continue;
    out.push({date:d.date,title,amount:Math.abs(a.value),credit:a.cr||a.neg||STMT_CREDIT.test(line)});
  }
  return out;
}
function parseCSV(text){

  const sep=[',',';','\t'].map(c=>[c,(lines[0].match(new RegExp(c==='\t'?'\t':'\\'+c,'g'))||[]).length]).sort((a,b)=>b[1]-a[1])[0][0];
  return lines.map(l=>{const row=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=''}else cur+=ch}row.push(cur);return row.map(c=>c.trim())});
}
function parseRows(rows,ref){

  const cell=v=>String(v==null?'':v).trim(),amt=v=>{let s=cell(v).replace(/[^\d.,\-()]/g,'');if(!/\d/.test(s))return null;const neg=/^-|\(/.test(s);s=s.replace(/[()\-]/g,'');if(/^\d{1,3}(\.\d{3})*,\d{1,2}$|^\d+,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');const n=parseFloat(s);return isFinite(n)?(neg?-n:n):null};
  let hi=rows.findIndex(r=>r.some(c=>/date/i.test(cell(c)))&&r.some(c=>/desc|detail|narr|merchant|particular|remark|transaction/i.test(cell(c))));
  const H=hi>=0?rows[hi].map(c=>cell(c).toLowerCase()):[],body=rows.slice(hi+1);
  const col=(re,not)=>H.findIndex(hd=>re.test(hd)&&!(not&&not.test(hd)));
  const ncol=Math.max(...body.map(r=>r.length));
  let dc=col(/trans.*date|txn.*date|purchase date/);if(dc<0)dc=col(/date/,/post|value|due/);if(dc<0)dc=col(/date/);
  if(dc<0){let best=-1,bs=0;for(let c=0;c<ncol;c++){const s=body.filter(r=>findDate(cell(r[c]),ref)).length;if(s>bs){bs=s;best=c}}dc=best}
  let tc=col(/desc|detail|narr|merchant|particular|remark/);
  if(tc<0){let best=-1,bl=0;for(let c=0;c<ncol;c++){if(c===dc)continue;const l=body.reduce((n,r)=>n+(/[a-z]/i.test(cell(r[c]))?cell(r[c]).length:0),0);if(l>bl){bl=l;best=c}}tc=best}

  const vals=ac>=0?body.map(r=>amt(r[ac])).filter(v=>v!=null&&v!==0):[];
  const flip=vals.length&&vals.filter(v=>v<0).length>vals.length/2;
  const out=[];
  for(const r of body){
    const d=findDate(cell(r[dc]),ref);if(!d)continue;const title=cleanTitle(cell(r[tc]))||cell(r[tc]).slice(0,80);if(!title)continue;
    let value,credit=false;
    if(deb>=0){const dv=amt(r[deb]),cv=cre>=0?amt(r[cre]):null;if(dv){value=Math.abs(dv)}else if(cv){value=Math.abs(cv);credit=true}else continue}
    else{const v=amt(r[ac]);if(v==null||v===0)continue;const cr=/\bcr\b/i.test(r.join(' '));value=Math.abs(v);credit=cr||(flip?v>0:v<0)}

}
function catRules(){const r={};for(const x of all('catrule'))if(x.key&&CATS.includes(x.category))r[x.key]=x.category;return r}
async function pdfText(file,password){
  if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}catch{}}
  let doc;
  try{doc=await window.pdfjsLib.getDocument({data:await file.arrayBuffer(),password:password||undefined}).promise}
  catch(e){throw new Error(e&&e.name==='PasswordException'?'This PDF is locked. Type its password in the box and try again.':'That PDF could not be opened. Try the CSV or Excel download from your bank instead.')}
  let out='';
  for(let p=1;p<=Math.min(doc.numPages,30);p++){
    const tc=await (await doc.getPage(p)).getTextContent(),rows=[];
    for(const it of tc.items){if(!it.str||!it.str.trim())continue;const y=it.transform[5],x=it.transform[4];let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,items:[]};rows.push(r)}r.items.push([x,it.str])}

  }

  return out;
}
async function excelRows(file){
  if(!window.XLSX)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  const wb=window.XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  let best=[];for(const n of wb.SheetNames){const r=window.XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,dateNF:'yyyy-mm-dd'});if(r.length>best.length)best=r}

let actx,ringT,lastPing=Date.now();const fired=new Set();
function beep(n){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
  for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=i%2?880:660;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+i*.28;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.24);o.start(t);o.stop(t+.26)}}catch{}}

function ring(a){
  const stop=()=>{clearInterval(ringT);$('#ring').classList.remove('open')};
  $('#ring').replaceChildren(h('div',{class:'bell'},'⏰'),h('div',{class:'t'},a.time),h('div',{style:'font-size:1.2rem;font-weight:600'},a.label||'Alarm'),
    h('button',{onclick:()=>{stop();if(a.repeat==='Just once'&&a.id)Store.put('items',a.id,{...a,on:false})}},'Stop'),
    h('button',{class:'ghost',onclick:()=>{stop();setTimeout(()=>ring(a),5*60000)}},'Snooze 5 minutes'));
  $('#ring').classList.add('open');beep(4);clearInterval(ringT);ringT=setInterval(()=>beep(4),1600);
}
function tick(){
  if(!S.ready)return;const n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes()),dow=n.getDay(),mine=me().nick;
  for(const a of all('alarm')){
    if(!a.on||a.time!==hm)continue;const key=a.id+today()+hm;if(fired.has(key))continue;
    if(a.who&&a.who!=='Both of us'&&mine&&a.who!==mine)continue;
    if(a.repeat==='Weekdays'&&(dow===0||dow===6))continue;if(a.repeat==='Weekends'&&dow>0&&dow<6)continue;
    fired.add(key);ring(a);

    if(m.on===false||(m.until&&m.until<today())||!timesOf(m).includes(hm))continue;
    if(m.who&&m.who!=='Both of us'&&mine&&m.who!==mine)continue;
