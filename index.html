<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nestory</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nestory">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F1FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1626" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F1FA; --card:#FFFFFF; --ink:#33263F; --muted:#77698A; --line:#E7DFF0;
  --berry:#DB4C78; --berry-soft:#FDE6EE; --mint:#23907F; --mint-soft:#DDF4EF;
  --sun:#F2B233; --sun-soft:#FFF1CF; --sky:#5C89E0; --sky-soft:#E2ECFD;
  --shadow:0 6px 18px rgba(74,48,99,.08);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1D1626; --card:#2A2136; --ink:#F3ECF9; --muted:#AC9EBB; --line:#3D314C;
    --berry:#F0769B; --berry-soft:#4A2637; --mint:#4CC4B1; --mint-soft:#1F3F3B;
    --sun:#F7C65A; --sun-soft:#4A3C1C; --sky:#8AAEF2; --sky-soft:#263654;
    --shadow:0 6px 18px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#1D1626; --card:#2A2136; --ink:#F3ECF9; --muted:#AC9EBB; --line:#3D314C;
  --berry:#F0769B; --berry-soft:#4A2637; --mint:#4CC4B1; --mint-soft:#1F3F3B;
  --sun:#F7C65A; --sun-soft:#4A3C1C; --sky:#8AAEF2; --sky-soft:#263654;
  --shadow:0 6px 18px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
img{max-width:100%}

#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative}
#top{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
#top .logo{width:40px;height:40px;flex:none}
#top h1{font-size:1.55rem;flex:1}
#top .back{font-weight:600;color:var(--berry);padding:8px 10px 8px 0;font-size:1rem}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:1.3rem;display:grid;place-items:center}
#main{flex:1;overflow-y:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
#tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px 8px}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.72rem;font-weight:600;color:var(--muted);padding:6px 0;border-radius:14px}
#tabs button span{font-size:1.35rem;line-height:1.2;filter:grayscale(.7);opacity:.75}
#tabs button[aria-current="page"]{color:var(--berry);background:var(--berry-soft)}
#tabs button[aria-current="page"] span{filter:none;opacity:1}

.banner{background:var(--sun-soft);border-radius:14px;padding:10px 14px;font-size:.88rem;margin-bottom:12px}
.hello{font-size:1.7rem;margin:6px 0 2px}
.sub{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:1.15rem;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 button{font:600 .85rem var(--body);color:var(--berry)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px}
.head h2{font-size:1.6rem}
.head p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.btn{background:var(--berry);color:#fff;font-weight:700;border-radius:999px;padding:10px 18px;white-space:nowrap;text-align:center}
:root[data-theme="dark"] .btn{color:#2A0F1B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#2A0F1B}}
.btn.soft{background:var(--berry-soft);color:var(--berry)}
.btn.mint{background:var(--mint-soft);color:var(--mint)}
.btn.wide{width:100%;padding:13px}
.btn[disabled]{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips .btn{padding:8px 14px;font-size:.9rem}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:22px;padding:14px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;background:var(--card);box-shadow:var(--shadow)}
.tile .em{font-size:1.7rem;width:46px;height:46px;border-radius:16px;display:grid;place-items:center}
.tile b{font-family:var(--display);font-size:1.08rem;display:block;line-height:1.2;margin-top:8px}
.tile small{color:var(--muted);font-size:.8rem}
.t0 .em{background:var(--berry-soft)}.t1 .em{background:var(--mint-soft)}.t2 .em{background:var(--sky-soft)}.t3 .em{background:var(--sun-soft)}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;width:100%;box-shadow:var(--shadow)}
.row .ic{font-size:1.3rem;width:40px;height:40px;border-radius:14px;background:var(--bg);display:grid;place-items:center;flex:none}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-weight:600;overflow-wrap:anywhere}
.row .rt small{color:var(--muted);display:block;font-size:.84rem;overflow-wrap:anywhere}
.row .rr{font-weight:700;white-space:nowrap;font-size:.95rem;text-align:right}
.row.done .rt b{text-decoration:line-through;color:var(--muted)}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:.9rem;color:#fff}
.tick.on{background:var(--mint);border-color:var(--mint)}
.day{font-weight:700;color:var(--muted);font-size:.82rem;margin:14px 4px 6px}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty .em{font-size:2.6rem;display:block;margin-bottom:6px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;background:var(--sky-soft);color:var(--sky)}
.pill.soon{background:var(--sun-soft);color:#9A6A00}.pill.now{background:var(--berry-soft);color:var(--berry)}
:root[data-theme="dark"] .pill.soon{color:var(--sun)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.soon{color:var(--sun)}}

.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.month button{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:1.2rem;text-align:center}
.month b{font-family:var(--display);font-size:1.2rem}
.big{font-family:var(--display);font-size:2rem;line-height:1.1}
.bar{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--mint)}
.bar i.over{background:var(--berry)}
.catrow{margin-bottom:12px}
.catrow .l{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;align-items:center}
.catrow input{width:110px;text-align:right}
.drops{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.drops span{font-size:1.5rem;filter:grayscale(1);opacity:.3}
.drops span.on{filter:none;opacity:1}

.polas{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;padding-top:6px}
.pola{background:#fff;padding:8px 8px 10px;border-radius:6px;box-shadow:0 8px 20px rgba(60,40,80,.18);color:#33263F;display:block;width:100%}
.pola:nth-child(odd){transform:rotate(-2deg)}.pola:nth-child(even){transform:rotate(1.6deg)}.pola:nth-child(3n){transform:rotate(-.6deg)}
.pola img,.pola .ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:3px;background:#EEE6F5}
.pola .ph{display:grid;place-items:center;font-size:2rem}
.pola b{font-family:var(--display);display:block;margin-top:6px;line-height:1.15}
.pola small{color:#77698A;font-size:.78rem}

.chat{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.msg{max-width:80%;padding:9px 13px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--berry-soft)}
.msg small{display:block;color:var(--muted);font-size:.7rem;margin-top:2px}
.composer{position:sticky;bottom:-24px;background:var(--bg);padding:8px 0 14px;display:flex;gap:8px;margin-top:auto}
.composer input{flex:1}
.quick{display:flex;gap:6px;position:sticky;bottom:44px}
.quick button{font-size:1.3rem;background:var(--card);border-radius:50%;width:38px;height:38px;text-align:center;box-shadow:var(--shadow)}
.chatwrap{display:flex;flex-direction:column;min-height:100%}

input:not([type=checkbox]):not([type=file]),select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;min-height:46px}
.card input:not([type=checkbox]),.card select{background:var(--bg)}
textarea{min-height:90px;resize:vertical}
label.f{display:block;margin-bottom:12px;font-weight:600;font-size:.88rem}
label.f>span{display:block;margin-bottom:4px}
label.chk{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:600}
label.chk input{width:22px;height:22px;accent-color:var(--berry)}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.emojis button{font-size:1.5rem;width:44px;height:44px;border-radius:50%;background:var(--bg);text-align:center}
.emojis button[aria-pressed="true"]{background:var(--berry-soft);outline:2px solid var(--berry)}

#veil{position:fixed;inset:0;background:rgba(30,18,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#veil.open{display:flex}
#sheet{background:var(--card);width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
#sheet .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
#sheet .sh h2{font-size:1.35rem}
#sheet .x{width:38px;height:38px;border-radius:50%;background:var(--bg);text-align:center;font-size:1.1rem;flex:none}
.actions{display:flex;gap:10px;margin-top:6px}
.actions .btn{flex:1}
.note{font-size:.84rem;color:var(--muted);margin:0 0 12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:16px;z-index:40;max-width:min(92%,480px);display:none;gap:12px;align-items:center;font-size:.92rem}
#toast.open{display:flex}
#toast button{color:var(--sun);font-weight:700;white-space:nowrap}
#ring{position:fixed;inset:0;background:var(--berry);color:#fff;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#ring.open{display:flex}
#ring .t{font-family:var(--display);font-size:4rem;line-height:1}
#ring button{background:#fff;color:#B83360;font-weight:700;border-radius:999px;padding:14px 30px;min-width:200px;text-align:center}
#ring button.ghost{background:rgba(255,255,255,.2);color:#fff}
#ring .bell{font-size:4rem;animation:wig .5s infinite alternate}
@keyframes wig{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
#splash{position:absolute;inset:0;background:var(--bg);display:grid;place-items:center;z-index:10;text-align:center}
#splash svg{width:96px;height:96px}
#splash p{color:var(--muted);margin:8px 0 0}
.answer{white-space:pre-wrap;line-height:1.55}
.rev{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rev input[type=checkbox]{width:22px;height:22px;accent-color:var(--berry)}
.rev select{grid-column:2/4;min-height:38px;padding:6px 10px}
.rev small{color:var(--muted)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two small{color:var(--muted);font-size:.82rem}
.two .big{font-size:1.5rem}
.ec h3{font-size:1.25rem;margin-bottom:4px}
.ec dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:8px 0 4px;font-size:1.02rem}
.ec dt{color:var(--muted)}
.ec dd{margin:0;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.mp{display:grid;grid-template-columns:76px 1fr;gap:6px 10px;align-items:center}
.mp input{min-height:40px!important;padding:7px 10px!important}
.cd{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.cd>div{background:var(--bg);border-radius:16px;padding:10px 8px;text-align:center}
.cd b{font-family:var(--display);font-size:1.9rem;display:block;line-height:1.05}
.cd small{color:var(--muted);font-size:.78rem;display:block}
.otd{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.otd button{flex:none;width:100px;text-align:center}
.otd img,.otd .ph{width:100px;height:100px;object-fit:cover;border-radius:14px;display:grid;place-items:center;background:var(--bg);font-size:2rem}
.tick .ti{opacity:.55;font-size:.95rem}
#lock{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#lock.open{display:flex}
#lock input{max-width:220px;text-align:center;font-size:1.4rem;letter-spacing:.3em}
@media (prefers-reduced-motion:reduce){#ring .bell{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="splash"><div>
    <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#logo"/></svg>
    <h1 style="font-size:2rem">Nestory</h1><p>Opening your nest…</p></div></div>
  <header id="top"></header>
  <main id="main"></main>
  <nav id="tabs" aria-label="Sections"></nav>
</div>
<div id="veil"><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<div id="ring" role="alertdialog" aria-label="Alarm"></div>
<div id="lock" role="dialog" aria-modal="true" aria-label="Nestory is locked"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="logo" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="20" fill="var(--berry-soft)"/>
  <path d="M32 17.5c-2-3.6-7.2-1.7-5.8 2.5 1 3 5.8 5.8 5.8 5.8s4.8-2.800 5.800-5.800c1.400-4.200-3.800-6.100-5.800-2.500z" fill="var(--berry)"/>
  <circle cx="23.500" cy="35" r="9.500" fill="var(--sky)"/><circle cx="40.500" cy="35" r="9.500" fill="var(--berry)"/>
  <circle cx="20.500" cy="33" r="1.400" fill="#33263F"/><circle cx="26.500" cy="33" r="1.400" fill="#33263F"/>
  <circle cx="37.500" cy="33" r="1.400" fill="#33263F"/><circle cx="43.500" cy="33" r="1.400" fill="#33263F"/>
  <path d="M21.800 36h3.400l-1.700 2.600zM38.800 36h3.400l-1.700 2.600z" fill="var(--sun)"/>
  <path d="M8 41h48c0 9-10.500 15-24 15S8 50 8 41z" fill="var(--sun)"/>
  <path d="M15 46c8 3 26 3 34 0M21 51c6 2 16 2 22 0" stroke="#fff" stroke-opacity=".6" stroke-width="1.700" stroke-linecap="round" fill="none"/>
</symbol></defs></svg>

<script>
"use strict";
/* ===== ONLINE SETUP: paste your two Supabase values between the quotes ===== */
const NESTORY_SUPABASE={
  url:"https://oxyncmbgaobcntrpbkwf.supabase.co",  // Project URL, looks like https://abcdefgh.supabase.co
  key:"sb_publishable_...your full key..."    // Publishable key, starts with sb_publishable_
};
/* ========================================================================== */
/* ---------- tiny helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,a,...kids){
  const e=document.createElement(tag);
  if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k in e){try{e[k]=v}catch{e.setAttribute(k,v)}}else e.setAttribute(k,v===true?'':v);}
  for(const c of kids.flat(Infinity)){if(c==null||c===false||c==='')continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}
  return e;
}
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const t0=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const pd=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const nice=s=>{const d=pd(s);return d?d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):''};
const niceDay=s=>{const d=pd(s);if(!d)return 'No date';const df=Math.round((d-t0())/864e5);return df===0?'Today':df===-1?'Yesterday':d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})};
const gid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const cur=()=>(S.items.get('settings')?.currency)||'AED';
const money=n=>cur()+' '+(Math.round(num(n)*100)/100).toLocaleString(undefined,{maximumFractionDigits:2});
const sum=(a,f)=>a.reduce((t,x)=>t+num(f(x)),0);

/* ---------- what the app knows about ---------- */
const CATS=['Groceries','Dining out','Rent & home','Utilities','Transport','Health','Shopping','Family','Entertainment','Travel','Subscriptions','Gifts','Other'];
const CI={'Groceries':'🛒','Dining out':'🍜','Rent & home':'🏠','Utilities':'💡','Transport':'🚗','Health':'💊','Shopping':'🛍️','Family':'👨‍👩‍👧','Entertainment':'🎬','Travel':'✈️','Subscriptions':'📺','Gifts':'🎁','Other':'🧺'};
const byDate=k=>(a,b)=>String(b[k]||'').localeCompare(String(a[k]||''));
const soon=k=>(a,b)=>String(a[k]||'9').localeCompare(String(b[k]||'9'));
const j=(...a)=>a.filter(Boolean).join(', ');
const K={
  expense:{name:'expense',plural:'Expenses',icon:'🧾',
    f:[['amount','Amount','number',{req:1}],['title','Where or what','text',{req:1,ph:'Supermarket, petrol, dinner…'}],['date','Date','date',{def:today}],['category','Category','select',{o:CATS,def:'Other'}],['paidBy','Paid by','person'],['method','Paid with','select',{o:['Card','Cash','Bank transfer','Wallet']}],['note','Note','area']]},
  saving:{name:'saving',plural:'Savings',icon:'🐷',blurb:'Accounts, deposits, gold and goals.',empty:'Add your first savings pot.',
    f:[['name','Name','text',{req:1,ph:'Emergency fund'}],['type','Type','select',{o:['Bank savings','Fixed deposit','Gold','Mutual fund','Chit / scheme','Cash','Other']}],['where','Bank or place'],['amount','Saved so far','number'],['target','Goal amount','number'],['maturity','Matures on','date'],['owner','Whose','person'],['note','Note','area']],
    row:i=>[i.name,j(i.type,i.where,i.maturity&&'matures '+nice(i.maturity)),money(i.amount)]},
  asset:{name:'asset',plural:'Assets',icon:'💎',blurb:'Everything you own that matters.',empty:'List your first asset, like gold, land or a car.',
    f:[['name','Name','text',{req:1}],['type','Type','select',{o:['Property','Land','Vehicle','Gold & jewellery','Electronics','Investment','Furniture','Other']}],['value','Value today','number'],['bought','Bought on','date'],['owner','In whose name','person'],['where','Where it is / where papers are kept'],['note','Note','area']],

async function lanConnect(){
  let hello;
  try{const r=await fetch('api/hello',{cache:'no-store'});if(!r.ok)return null;hello=await r.json();if(hello.app!=='nestory')return null}catch{return null}
  const snapOf=async t=>{try{const r=await fetch('api/snapshot',{headers:{'x-token':t},cache:'no-store'});return r.ok?await r.json():null}catch{return null}};
  let tok=null;try{tok=localStorage.getItem('nestory.token')}catch{}
  let snap=tok?await snapOf(tok):null;
  while(!snap){tok=await lanLogin(hello);try{localStorage.setItem('nestory.token',tok)}catch{}snap=await snapOf(tok)}
  const cols={items:new Map(snap.items),chat:new Map(snap.chat),priv:new Map(snap.priv)},subs={items:[],chat:[],priv:[]};
  const scope=p=>p.startsWith('data/users/')?'priv':p;
  const emit=s=>{const docs=[...cols[s]].map(([id,d])=>({id,exists:true,data:()=>d}));subs[s].forEach(f=>f({docs}))};
  const api=async(m,s,id,body)=>{let r;try{r=await fetch('api/doc/'+s+'/'+encodeURIComponent(id),{method:m,headers:{'x-token':tok,'content-type':'application/json'},body:body?JSON.stringify(body):undefined})}catch{throw new Error('The laptop running Nestory is not reachable.')}
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Server error '+r.status);return j};
  const col=p=>{const s=scope(p);const c={orderBy:()=>c,limit:()=>c,
    onSnapshot(fn){subs[s].push(fn);setTimeout(()=>emit(s),0);return()=>{}},
    doc:id=>({async set(d){if(cols[s]){cols[s].set(id,d);emit(s)}await api('PUT',s,id,d)},async delete(){if(cols[s]){cols[s].delete(id);emit(s)}await api('DELETE',s,id)},async get(){const r=await api('GET',s,id);return{id,exists:!!r.data,data:()=>r.data}}})};return c};
  let opened=false;
  const es=new EventSource('api/events?token='+encodeURIComponent(tok));
  es.onmessage=e=>{try{const m=JSON.parse(e.data);if(!cols[m.s])return;if(m.d==null)cols[m.s].delete(m.id);else cols[m.s].set(m.id,m.d);emit(m.s)}catch{}};
  es.onopen=async()=>{if(opened){const n=await snapOf(tok);if(n){for(const k in cols){cols[k]=new Map(n[k]);emit(k)}}}opened=true};
  return{db:{collection:col},uid:snap.uid};
}

/* ---------- online mode (Supabase) ---------- */
async function supaConnect(cfg){
  await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
  const sb=window.supabase.createClient(cfg.url.trim(),cfg.key.trim());
  let session=(await sb.auth.getSession()).data.session;
  while(!session)session=await supaLogin(sb);
  const uid=session.user.id;
  S.signOut=async()=>{await sb.auth.signOut();location.reload()};
  const load=async()=>{const out={items:new Map(),chat:new Map(),priv:new Map()};
    for(let from=0;;from+=1000){const{data,error}=await sb.from('docs').select('scope,id,data').in('scope',['items','chat','priv']).order('id').range(from,from+999);
      if(error)throw new Error(error.message);for(const r of data)out[r.scope]&&out[r.scope].set(r.id,r.data);if(data.length<1000)break}
    return out};
  let cols=await load();const subs={items:[],chat:[],priv:[]};
  const scope=p=>p.startsWith('data/users/')?'priv':p;
  const emit=s=>{const docs=[...cols[s]].map(([id,d])=>({id,exists:true,data:()=>d}));subs[s].forEach(f=>f({docs}))};
  const chk=r=>{if(r.error)throw new Error(r.error.message);return r};
  const col=p=>{const s=scope(p);const c={orderBy:()=>c,limit:()=>c,
    onSnapshot(fn){subs[s].push(fn);setTimeout(()=>emit(s),0);return()=>{}},
    doc:id=>({
      async set(d){if(cols[s]){cols[s].set(id,d);emit(s)}chk(await sb.from('docs').upsert({scope:s,id,owner:s==='priv'?uid:null,data:d,updated_at:new Date().toISOString()}))},
      async delete(){if(cols[s]){cols[s].delete(id);emit(s)}chk(await sb.from('docs').delete().eq('scope',s).eq('id',id))},
      async get(){const r=chk(await sb.from('docs').select('data').eq('scope',s).eq('id',id).maybeSingle());return{id,exists:!!r.data,data:()=>r.data&&r.data.data}}})};return c};
  let live=false;
  sb.channel('nestory-docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    const del=p.eventType==='DELETE',r=del?p.old:p.new;if(!r||!cols[r.scope])return;
    if(del)cols[r.scope].delete(r.id);else cols[r.scope].set(r.id,r.data);emit(r.scope);
  }).subscribe(async st=>{if(st==='SUBSCRIBED'){if(live){try{cols=await load();for(const k in subs)emit(k)}catch{}}live=true}});
  document.addEventListener('visibilitychange',async()=>{if(!document.hidden){try{cols=await load();for(const k in subs)emit(k)}catch{}}});
  return{db:{collection:col},uid};
}

function addMonths(d,n){const day=d.getDate(),x=new Date(d.getFullYear(),d.getMonth()+n,1);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return x}

const PINK='nestory.pin';
const getPin=()=>{try{return localStorage.getItem(PINK)}catch{return null}};
async function pinHash(p){
  const str='nestory:'+p;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch{let a=5381;for(let r=0;r<3000;r++)for(const c of str+r)a=((a*33)^c.charCodeAt(0))>>>0;return 'x'+a.toString(16)}
}
let unlocking=false,hiddenAt=0;

    h('button',{style:'color:var(--muted);font-size:.88rem;margin-top:14px',onclick:()=>{if(S.signOut){try{localStorage.removeItem(PINK)}catch{}S.signOut()}else msg.textContent='To reset it, clear this website\'s data in your browser settings.'}},'Forgot PIN?'));

function cycle(){
  const st=all('period').map(p=>pd(p.start)).filter(Boolean).sort((a,b)=>a-b);if(!st.length)return null;
  const gaps=[];for(let i=1;i<st.length;i++){const g=Math.round((st[i]-st[i-1])/864e5);if(g>=15&&g<=60)gaps.push(g)}
  const last6=gaps.slice(-6),avg=last6.length?Math.round(last6.reduce((a,b)=>a+b,0)/last6.length):28,last=st[st.length-1];
  let next=new Date(last.getFullYear(),last.getMonth(),last.getDate()+avg);
  return{avg,next,last,guess:!last6.length,day:Math.round((t0()-last)/864e5)+1};
}
